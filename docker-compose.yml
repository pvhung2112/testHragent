services:
  # MongoDB Database Service
  mongodb:
    image: mongo:latest
    container_name: hr_agent_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hr_agent_backend
    restart: unless-stopped
    ports:
      - "5050:5050"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PORT=5050
      - MONGODB_URI=mongodb://mongodb:27017/hr_agent
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy

  # React + Vite Frontend Service (Served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5050
    container_name: hr_agent_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data: